name: folo
description: "Folo — a cross-platform productivity app for people who manage relationships, follow-ups and personal goals."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  # Imported by the code gen-l10n generates. The delegates the app registers come
  # from material_ui (lib/l10n/localizations_delegates.dart).
  flutter_localizations:
    sdk: flutter
  # State management: compile-safe providers, testable without widget trees.
  flutter_riverpod: ^3.4.3
  # Declarative routing with real URLs (web) and deep links (mobile).
  go_router: ^18.0.1
  # ICU message formatting for the generated AppLocalizations class. The version
  # is whatever flutter_localizations pins — do not float it independently.
  intl: any
  # Material widgets and localizations. Since Flutter 3.47 they live here, not in
  # the framework, whose flutter/material.dart is frozen. Brings cupertino_ui.
  material_ui: ^1.4.0
  # Auth, session persistence and email/OAuth deep links in one package, so
  # this feature needs no app_links, shared_preferences or provider SDKs.
  supabase_flutter: ^2.17.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  # Required by `flutter gen-l10n`: without it the tool refuses to generate and
  # the localizations are not importable. Config lives in l10n.yaml.
  generate: true

  # The official flat Google "G", from developers.google.com/identity — their
  # branding guidelines require their own mark on a sign-in button and forbid
  # redrawing or recolouring it. 1x/2x/3x so Flutter picks the density.
  assets:
    - assets/images/google_g.png

  # Bundled, not fetched: identical rendering on Web and mobile, no webfont
  # request, no google_fonts dependency. One variable file covers every weight;
  # styles set the `wght` axis (see app_typography.dart). Licence: assets/fonts/OFL.txt
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
