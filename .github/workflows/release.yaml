# Release — release-please on main.
#
# Flow:
#   1. Conventional commits land on main (squash merge, PR title = commit subject).
#   2. This workflow opens/updates a Release PR (version bump in pubspec.yaml +
#      CHANGELOG.md).
#   3. Merging that PR runs this workflow again; release-please sees its own PR
#      merged and cuts the tag + GitHub Release.
#   4. A signed AAB + APK are built, attached to that release, and the AAB goes
#      to the Play internal testing track. The release stays a GitHub
#      pre-release until promote.yaml ships the same build further.
#
# Trunk-based, no branches per channel: every release starts internal, only
# promotion decides what reaches users. Setup: README.md → Releases.
# Not here yet: TestFlight upload, iOS build.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          # GITHUB_TOKEN cannot trigger other workflows, so the Release PR it
          # opens gets no CI run. Fine while nothing is a required check; set a
          # RELEASE_PLEASE_TOKEN (PAT or GitHub App token) once checks are
          # required on main.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  artifacts:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - run: flutter pub get

      - name: Write the upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/upload.jks
          cat > android/key.properties <<EOF
          storeFile=upload.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # Play needs a strictly increasing versionCode. Derived from the tag so
      # promote.yaml can find the same build again.
      # ponytail: breaks once minor or patch passes 99, widen the multipliers then.
      - name: Compute versionCode
        id: version
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          IFS=. read -r major minor patch <<< "${TAG#v}"
          echo "code=$((major * 10000 + minor * 100 + patch))" >> "$GITHUB_OUTPUT"

      - name: Build AAB and APK
        env:
          BUILD_NUMBER: ${{ steps.version.outputs.code }}
        run: |
          flutter build appbundle --release --build-number="$BUILD_NUMBER"
          flutter build apk --release --build-number="$BUILD_NUMBER"

      - name: Build web
        run: |
          flutter build web --release
          (cd build/web && zip -qr "../../loomia-web.zip" .)

      - name: Attach artifacts to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh release upload "$TAG" \
            build/app/outputs/flutter-apk/app-release.apk \
            loomia-web.zip \
            --clobber
          gh release edit "$TAG" --prerelease

      - name: Upload to Play internal testing
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.folo.folo
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          releaseName: ${{ needs.release-please.outputs.tag_name }}
          track: internal
          status: completed
